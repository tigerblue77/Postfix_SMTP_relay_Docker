# Automatic dependency update pull requests
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps are grouped into a single PR that the
      # dependabot-auto-merge workflow merges once CI passes
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Major bumps can contain breaking changes, keep them in a separate
      # PR that waits for human review
      actions-major:
        patterns:
          - "*"
        update-types:
          - major

  # Base image of the Dockerfile, replacing wader/bump. Daily, to keep the
  # cadence bump.yml had.
  #
  # Dependabot only offers tags matching the shape of the current one, so
  # 'trixie-<date>-slim' stays on trixie and stays slim, the way the
  # '/^trixie-.*-slim/' filter in the old bump comment did. A suite change
  # (trixie -> forky) is a deliberate edit, as it was with bump.
  #
  # And it has a deadline nothing here announces. Debian's security team
  # supports trixie (released 2025-08-09) until 2028-08-09, and Debian LTS
  # takes it from there to 2030-06-30 -- the dates as
  # https://wiki.debian.org/LTS gave them on 2026-09-27; check
  # https://www.debian.org/releases/ and that page again rather than trusting
  # these. When support ends, no new trixie-<date>-slim tag is published and
  # these daily pull requests simply stop, which looks exactly like having
  # nothing to update. So the suite bump is due before that date, not after
  # the pull requests go quiet.
  #
  # The last suite bump waited over two years for want of a way to test it
  # (wader/postfix-relay#86). That no longer holds: the whole suite runs on
  # amd64 and arm64 on every pull request, and the Debian release is pinned in
  # one assertion,
  # tests/test_image.py::test_the_image_is_a_single_debian_release, which
  # fails until it is moved in the same edit as the FROM line.
  #
  # A date is not a semver minor or patch, so these never match the
  # auto-merge rule below and always wait for review, like bump's PRs did.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily

  # The pinned test dependencies. They are exact pins now, so nothing moves
  # them on its own, and the suite is what says whether a bump is safe: every
  # one of these pull requests runs it.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly

  # The two images the suite runs beside the one it builds: mailpit, the server
  # every relayed message is read back from, and the last released
  # postfix-relay, which the upgrade tests start first so that this tree's
  # image reads state an older one wrote. Both live in a string in
  # tests/fixtures, and no ecosystem reads Python, so tests/mailpit.Dockerfile
  # and tests/upgrade-from.Dockerfile name them where this one looks --
  # dependabot's docker file fetcher matches any file whose name contains
  # "dockerfile", and it lists a directory rather than a single name, so one
  # entry covers both -- and the fixtures read the tags back out of them. The
  # directory has to be named: the fetcher does not recurse, so the base image
  # entry on "/" neither sees these files nor is disturbed by them.
  #
  # Unlike the base image above, a bump here is an ordinary semver minor or
  # patch, so the auto-merge rule applies to it. That is the right way round:
  # these are test peers rather than the shipped image, every one of these
  # pull requests runs the whole suite against the new one, and the suite is
  # the only thing that can say whether it still behaves as the tests expect.
  # One that does not stays red and waits for a person.
  - package-ecosystem: docker
    directory: /tests
    schedule:
      interval: weekly
