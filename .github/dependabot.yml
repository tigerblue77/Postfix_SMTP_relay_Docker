# Automatic dependency update pull requests
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Every entry sets a `cooldown` of seven days, none excepted. Dependabot waits
# three days after a release before it proposes a version update when no
# cooldown is configured, and an entry without a `cooldown` block gets exactly
# that, so what is set here is seven days instead of three. The auto-merge
# workflow merges a semver minor or patch bump by itself once the required
# checks pass, and those checks say the relay still works, not that the new
# release is what its authors published: the wait is the window in which a bad
# release is usually yanked or reported first. It is a number to edit, here and
# in tests/test_ruleset.py, if seven turns out to be too slow. It applies to
# version updates only; a security update is never delayed.
#
# What it covers: the exact pins of tests/requirements.txt (pip), the two docker
# anchors in /tests, and the Debian base image of the Dockerfile. A new base tag
# waits seven days like the rest, which costs little: the Dockerfile runs
# 'apt-get full-upgrade' at build time (invariant 37), so the packages' own
# fixes reach the image whatever tag it sits on. Excluding debian from the
# cooldown, so that a tag is proposed on the day it is published, is the
# alternative; it would be one `exclude` on that entry and a line in the test.
#
# What it does not cover: the actions are pinned to major tags
# (actions/checkout@v7 and so on). Dependabot keeps the precision of the ref it
# finds, so for an @v7 pin it proposes the next major version and never v7.x.y,
# and a major bump is reviewed by hand; the cooldown only delays that proposal.
# A floating tag that is moved to a new commit is picked up by the next run with
# no pull request at all, whatever the cooldown says, and only pinning to a full
# commit SHA prevents that. Those actions are deliberately not pinned that way.
#
# Only default-days exists for github-actions and docker as a day count; the
# semver-major/minor/patch-days keys are for the semver ecosystems, here pip.
# include and exclude are accepted everywhere and used nowhere, so that every
# dependency of an entry waits; the test requires a reason for each one added.
# No workflow here validates this file. Dependabot does, in a check named after
# the file on a pull request that touches it, which is not a required check, and
# what it reports once the file is on master shows on the repository's Insights >
# Dependency graph > Dependabot page. tests/test_ruleset.py holds the rest of
# this to the file.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor and patch bumps are grouped into a single PR that the
      # dependabot-auto-merge workflow merges once CI passes
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Major bumps can contain breaking changes, keep them in a separate
      # PR that waits for human review
      actions-major:
        patterns:
          - "*"
        update-types:
          - major

  # Base image of the Dockerfile, replacing wader/bump. Daily, to keep the
  # cadence bump.yml had.
  #
  # Dependabot only offers tags matching the shape of the current one, so
  # 'trixie-<date>-slim' stays on trixie and stays slim, the way the
  # '/^trixie-.*-slim/' filter in the old bump comment did. A suite change
  # (trixie -> forky) is a deliberate edit, as it was with bump.
  #
  # And it has a deadline nothing here announces. Debian's security team
  # supports trixie (released 2025-08-09) until 2028-08-09, and Debian LTS
  # takes it from there to 2030-06-30 -- the dates as
  # https://wiki.debian.org/LTS gave them on 2026-09-27; check
  # https://www.debian.org/releases/ and that page again rather than trusting
  # these. When support ends, no new trixie-<date>-slim tag is published and
  # these daily pull requests simply stop, which looks exactly like having
  # nothing to update. So the suite bump is due before that date, not after
  # the pull requests go quiet.
  #
  # The last suite bump waited over two years for want of a way to test it
  # (wader/postfix-relay#86). That no longer holds: the whole suite runs on
  # amd64 and arm64 on every pull request, and the Debian release is pinned in
  # one assertion,
  # tests/test_image.py::test_the_image_is_a_single_debian_release, which
  # fails until it is moved in the same edit as the FROM line.
  #
  # A date is not a semver minor or patch, so these never match the
  # auto-merge rule below and always wait for review, like bump's PRs did.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Seven days like every other entry, the base image included: a new tag
    # waits a week and then comes as a pull request. See the header for why
    # that costs little, and for the one-line alternative.
    cooldown:
      default-days: 7

  # The pinned test dependencies. They are exact pins now, so nothing moves
  # them on its own, and the suite is what says whether a bump is safe: every
  # one of these pull requests runs it.
  #
  # A longer wait for a major release, which is the likeliest to break the
  # suite and the one nobody has used yet; minor and patch wait as long as the
  # other ecosystems. These keys are for the semver ecosystems only.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7

  # The two images the suite runs beside the one it builds: mailpit, the server
  # every relayed message is read back from, and the last released
  # postfix-relay, which the upgrade tests start first so that this tree's
  # image reads state an older one wrote. Both live in a string in
  # tests/fixtures, and no ecosystem reads Python, so tests/mailpit.Dockerfile
  # and tests/upgrade-from.Dockerfile name them where this one looks --
  # dependabot's docker file fetcher matches any file whose name contains
  # "dockerfile", and it lists a directory rather than a single name, so one
  # entry covers both -- and the fixtures read the tags back out of them. The
  # directory has to be named: the fetcher does not recurse, so the base image
  # entry on "/" neither sees these files nor is disturbed by them.
  #
  # Unlike the base image above, a bump here is an ordinary semver minor or
  # patch, so the auto-merge rule applies to it. That is the right way round:
  # these are test peers rather than the shipped image, every one of these
  # pull requests runs the whole suite against the new one, and the suite is
  # the only thing that can say whether it still behaves as the tests expect.
  # One that does not stays red and waits for a person.
  - package-ecosystem: docker
    directory: /tests
    schedule:
      interval: weekly
    # Test peers, but the auto-merge lands a minor or patch bump of them
    # unattended all the same, so they wait like everything else.
    cooldown:
      default-days: 7
