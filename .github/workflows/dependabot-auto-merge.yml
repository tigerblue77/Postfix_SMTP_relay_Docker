# Auto-merge Dependabot pull requests for minor and patch updates, and for the
# Debian base image of the Dockerfile, once required checks pass. Major updates
# are left for human review.
#
# The base image is the one update that is not semver: its tag is
# trixie-<date>-slim, which fetch-metadata reports with an update-type of
# null, so it is picked out by what it is -- the docker ecosystem, the
# dependency named debian, the Dockerfile in the root directory -- rather
# than by how far the version moved. Dependabot only offers a tag of the same
# shape, so this can never move the image to another suite. What stands
# between such a pull request and master is what stands between any other
# change and it: the required checks of that ruleset, which run the whole suite
# against the image the pull request builds.
#
# Requirements:
# - "Allow auto-merge" enabled in the repository settings
# - a ruleset on master with required status checks, otherwise auto-merge
#   does not wait for CI and merges straight away. The one this expects is
#   committed as .github/rulesets/master.json, in the form github's
#   "Import a ruleset" takes.
# - a merge method that ruleset allows: it requires a linear history, which
#   rules out "--merge" and leaves "--squash", the one the maintainer's
#   pull requests use too.
# - for the merge to start the push workflows on master, the private key of
#   the GitHub App the branch updater uses, stored as a *Dependabot* secret
#   under the name the updater reads it by. See the token step below.
#
# Required checks are matched by job name, not by workflow name. The names
# that exist are "Build Image", "Pytest", "Pytest (arm64)",
# "Pytest (arm/v7, emulated)", "Event File", "Test Results", "ShellCheck",
# "Ruff", "actionlint", "zizmor", "Sign-off",
# "Verify Published Image (amd64)" / "(arm64)", "Publish latest" and
# "Image Scan"; "ci", "test", "lint", "lint-workflows", "sign-off" and "scan"
# are workflows and never report a check of their own, and one workflow can
# report more than one -- "lint" reports both "ShellCheck" and "Ruff", and
# "lint-workflows" both "actionlint" and "zizmor".
# Dependabot's commits carry "Signed-off-by: dependabot[bot]
# <support@github.com>", which is what lets "Sign-off" pass on them.
#
# "Pytest (arm/v7, emulated)" runs on every pull request since
# wader/postfix-relay#273, and is still not in the required list: its verdict
# comes from an emulator, where a QEMU artefact reads like a real failure, so
# it reports and a person looks rather than blocking a merge. Requiring it
# means adding it to .github/rulesets/master.json and importing that.
#
# The two "Verify Published Image" jobs are not candidates either, nor is
# "Publish latest", and for a firmer reason: they check -- and then tag -- the
# image a push to master published, so they never run on a pull request at all.
#
# "Image Scan" is not a candidate for that same firmer reason and one of its
# own. It runs on a schedule against the published image and has no
# pull_request trigger, so it reports no check here at all; and scan.yml's
# header says why letting a vulnerability database decide a pull request would
# be the wrong trade. It matters for auto-merge that it stays that way: these
# pull requests merge themselves once the required checks pass, and a gate
# whose verdict changes overnight for reasons unrelated to the diff would block
# a base image bump on the morning when that bump is the fix.

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Backstop. The job makes API calls and nothing else, none of which should
    # ever sit for github's default six hours.
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      # Whether the App's key is there to mint with. A secret cannot be read in
      # an if:, so the step below reads this instead, and the key itself is
      # only ever read by the step that mints.
      APP_PRIVATE_KEY_SET: ${{ secrets.PULL_REQUESTS_UPDATE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub merges an auto-merge pull request in the name of whoever enabled
      # it, and a push made with this workflow's GITHUB_TOKEN starts no
      # workflow. Enabled with that token, a merge lands on master and nothing
      # runs: ci.yml does not build or publish it, so :latest stays on the
      # image before -- for the Debian base image, the whole point of the bump
      # -- and the branch updater never hears of it either. Enabled with the
      # GitHub App's token, the merge is the App's, and its push starts them
      # like any other merge.
      #
      # A run Dependabot starts reads Dependabot secrets and never the Actions
      # ones, so the App's private key has to be stored a second time, as a
      # Dependabot secret, under the name the branch updater reads it by. The
      # client ID is a variable, not a secret, and variables do reach these
      # runs, although GitHub documents the rule for secrets only. Until the
      # key is there, or if the variable ever stops arriving, the step is
      # skipped and the merge below falls back to GITHUB_TOKEN, which still
      # merges and starts nothing -- what this workflow did before the step
      # existed.
      #
      # The token gets what the merge needs and nothing else (zizmor's
      # github-app): contents and pull requests to enable auto-merge and land
      # the squash, and workflows because a minor or patch bump of an action
      # edits a workflow file, which a GitHub App's token can only merge with
      # that permission. They are the ones the branch updater asks the same
      # App for. The key is read nowhere else: this job checks nothing out and
      # runs nothing from the pull request.
      - name: Mint an installation token, if a GitHub App is configured for Dependabot
        id: app-token
        if: vars.PULL_REQUESTS_UPDATE_APP_CLIENT_ID != '' && env.APP_PRIVATE_KEY_SET == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PULL_REQUESTS_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PULL_REQUESTS_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # Squash, because master requires a linear history: a merge commit is
      # exactly what that rule refuses, so "--merge" asked for the one kind of
      # merge master cannot take. tests/test_ruleset.py holds this flag to the
      # methods the ruleset allows.
      - name: Enable auto-merge for minor and patch updates and the Debian base image
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
          || steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || (steps.metadata.outputs.dependency-names == 'debian'
          && steps.metadata.outputs.package-ecosystem == 'docker'
          && steps.metadata.outputs.directory == '/')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The App's token when the step above minted one, GITHUB_TOKEN
          # otherwise; the comment above that step says what each one costs.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
