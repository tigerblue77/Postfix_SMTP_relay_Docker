# Workflow to retrieve test results from 'test' workflow into pull-requests
# see : https://github.com/EnricoMi/publish-unit-test-result-action/blob/v2.24.0/README.md#support-fork-repositories-and-dependabot-branches

name: Test Results

# zizmor calls workflow_run a fundamentally insecure trigger, and as a rule it
# is: the run it starts has write access and runs in the context of the default
# branch, so anything it takes from the run that triggered it is a way in. It is
# what lets this publish results for pull requests from forks and from
# Dependabot, whose own runs get a read-only token that cannot create a check
# (the README linked above says so). It is kept, with the one suppression below,
# for these reasons:
#  * the job never checks out or runs code from the run that triggered it. It
#    downloads two artifacts and hands them to an action as files to parse;
#  * what it takes from that run, the run id, the head sha and the event name,
#    goes to actions as inputs and is never interpolated into a shell;
#  * its token carries the five permissions below and nothing else;
#  * the action that reads the artifacts is the one pinned to a commit in this
#    tree.
# Moving the publishing into test.yml would remove the trigger and the
# suppression, and with them the check on every pull request that cannot write.
# tests/test_lint.py fails when a suppression is added, so this one is argued
# for here rather than appended to.

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [test]
    types:
      - completed

# Permission of github.token
# Limited to read-only for download-artifact
permissions:
  actions: read

jobs:
  test-results:
    name: Test Results
    runs-on: ubuntu-latest
    # Backstop. It downloads two artifacts and publishes a check: measured at
    # 17-51s over the last five runs.
    timeout-minutes: 10
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'

    permissions:
      checks: write

      # needed unless run with comment_mode: off
      pull-requests: write

      # only needed for private repository
      contents: read

      # only needed for private repository
      issues: read

      # required by download step to access artifacts API
      actions: read

    steps:
      - name: Download and Extract Artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 #v2.24.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.xml"