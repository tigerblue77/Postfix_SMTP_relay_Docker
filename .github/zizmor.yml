# The configuration of zizmor, the workflow linter that
# .github/workflows/lint-workflows.yml runs on every pull request. zizmor reads
# this path by itself, from the directory it is pointed at; nothing passes it
# on a command line.
#
# One audit is configured, and nothing is turned off.

rules:
  unpinned-uses:
    config:
      policies:
        # Actions are pinned to a version tag, never to a commit hash, and that
        # is the maintainer's decision: the tag is what Dependabot's weekly
        # github-actions updates move, and a hash would have it moving
        # something nobody can read. The one action that is pinned to a commit,
        # EnricoMi/publish-unit-test-result-action, stays pinned; this accepts
        # that as well as a tag. What it still refuses is an action named with
        # no ref at all.
        "*": ref-pin
